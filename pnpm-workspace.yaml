packages:
  - benchmark
  - docs
  - simulation-test
  - examples/**
  - packages/*
  - tmp/*

catalogMode: prefer
autoInstallPeers: false
enablePrePostScripts: true
linkWorkspacePackages: deep
strictPeerDependencies: false
provenance: true

allowBuilds:
  "@biomejs/biome": true
  esbuild: true
  simple-git-hooks: true

catalog:

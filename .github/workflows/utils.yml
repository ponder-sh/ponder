name: Utils

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  test-get-logs:
    name: Test getLotsRetryHelper
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: 
        viem-version: ['1', '2']
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - run: bun add --dev viem@${{ matrix.viem-version }}

      - name: Test
        run:  bun --filter @ponder/utils test src/_test 
        env:
          RPC_URL_ALCHEMY_1: ${{ secrets.RPC_URL_ALCHEMY_1 }}
          RPC_URL_INFURA_1: ${{ secrets.RPC_URL_INFURA_1 }}
          RPC_URL_QUICKNODE_1: ${{ secrets.RPC_URL_QUICKNODE_1 }}

name: Simulation Test

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Note: Seeds that found bugs. These run on every run, including scheduled runs.
  simulation-test-known-failures:
    name: Simulation Test Known Failures
    runs-on: self-hosted
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_id: uniswap-v4
            seed: 451a2d0e399fd375369d53bf04b652ee80730fc215963818f1a387d2aa78b198
          - app_id: uniswap-v4
            seed: 4ae5cc4f3594b76798249f1adb56d42dc1b544975a781f4c93b7e565507bd9cf
          - app_id: feature-multichain
            seed: e1802a439f23d2706e1a50b4b13aa743b931f8e2dcf1d7e39ea4b6e7dbd34640
          # Failed because of bug in crash recovery database migration when `ordering: "experimental_isolated"`.
          # https://github.com/ponder-sh/ponder/blob/e8eae6394a9c73a16d14f7ecf6317cdcd69aa9fd/packages/core/src/database/index.ts#L917
          - app_id: assessment
            seed: 3938fff044d4feb11b33dbdb57bae142ec6d73029611ddff14d9d4b11ada2fe6
          # Failed because of a bug in reorg handling when `ordering: "multichain"`.
          # https://github.com/ponder-sh/ponder/blob/e8eae6394a9c73a16d14f7ecf6317cdcd69aa9fd/packages/core/src/runtime/realtime.ts#L572-L585
          - app_id: assessment
            seed: 8d07d00f53fe5beaf19c06696ea4e00120112ef753404e576372fc1fe18f4d13
          # Failed because of a bug in checkpoint calculation for pending events when `ordering: "omnichain"`.
          # https://github.com/ponder-sh/ponder/blob/e8eae6394a9c73a16d14f7ecf6317cdcd69aa9fd/packages/core/src/runtime/historical.ts#L281-L303
          - app_id: uniswap-v4
            seed: 31752f35f6443147d8fda82cb9b3c4a878292e9b3c52f2e36c582dba943872ed
          # Failed because of incorrect finalized block calculation in the test script after a crash recovery.
          # https://github.com/ponder-sh/ponder/blob/e8eae6394a9c73a16d14f7ecf6317cdcd69aa9fd/integration-test/src/index.ts#L1248-L1270
          - app_id: project-uniswap-v3-flash
            seed: 98c5c3716e33ba8ea2a8ba8d36f942cf1c2fb368f2d33a5f6bf434e087487bce
          # Failed because live indexing did not find factory child addresses for an account
          # when no log filter matched the block bloom.
          - app_id: super-assessment
            seed: a8adbd1bb01b06bc6917e44f21d791c149df895586235ac6f5d66b61410c5f4d
          # Failed because the app did not shut down during the backfill. JSON-RPC requests
          # continued after shutdown.
          - app_id: super-assessment
            seed: b282193354697a70d65856e52c5261a57df8faeac4054a53c37cf0fd36083697
          # Failed because the app did not shut down during the backfill. The next backfill
          # interval waited forever for an interval that failed.
          - app_id: super-assessment
            seed: 54a0bdaf17fbd26a521001d90ebcb0e615e296640a36dfe2e676a6dbc5d45c9f
          # Reaches an in-memory catch-up pass with a factory that ends before the catch-up range.
          # https://github.com/ponder-sh/ponder/commit/f2ec120c621c1baf7ec953b275fa0ea41f556d08
          - app_id: super-assessment
            seed: dd806f7f0928a4374f0ec253595e3ee6adabaa626f27010c192aaa474da6914d
          # Failed because the backfill hung and ran out of memory when only one block
          # eth_getLogs requests succeeded. Does not fail on every run.
          - app_id: super-assessment
            seed: 8bed09f93b79a0fe514f662fec58213e5dcac33cdf9219925999d9eb3cd6fff5

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          foundry: "false"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: pnpm build
      - run: pnpm install

      - name: Test ${{ matrix.app_id }} ${{ matrix.seed }}
        run: |
          cd simulation-test
          pnpm test ${{ matrix.app_id }}
        env:
          SEED: ${{ matrix.seed }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PONDER_RPC_URL_1: ${{ secrets.PONDER_RPC_URL_1 }}
          PONDER_RPC_URL_10: ${{ secrets.PONDER_RPC_URL_10 }}
          PONDER_RPC_URL_130: ${{ secrets.PONDER_RPC_URL_130 }}
          PONDER_RPC_URL_8453: ${{ secrets.PONDER_RPC_URL_8453 }}
          PGDATABASE: railway
          PGSSLMODE: disable
          NODE_ENV: ci

  simulation-test-fuzz:
    name: Simulation Test Fuzz
    runs-on: self-hosted
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app_id:
          - "assessment"
          - "feature-multichain"
          - "project-uniswap-v3-flash"
          - "reference-erc20"
          - "super-assessment"
          - "uniswap-v4"
          - "the-compact"
          - "basepaint"
        iteration: [0, 1, 2]

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          foundry: "false"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: pnpm build
      - run: pnpm install

      - name: Test ${{ matrix.app_id }} ${{ matrix.iteration }}
        run: |
          cd simulation-test
          pnpm test ${{ matrix.app_id }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PONDER_RPC_URL_1: ${{ secrets.PONDER_RPC_URL_1 }}
          PONDER_RPC_URL_10: ${{ secrets.PONDER_RPC_URL_10 }}
          PONDER_RPC_URL_130: ${{ secrets.PONDER_RPC_URL_130 }}
          PONDER_RPC_URL_8453: ${{ secrets.PONDER_RPC_URL_8453 }}
          PGDATABASE: railway
          PGSSLMODE: disable
          NODE_ENV: ci

  cleanup-simulation-test:
    name: Cleanup Simulation Test Databases
    needs: [simulation-test-known-failures, simulation-test-fuzz]
    if: ${{ always() }}
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          foundry: "false"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: |
          cd simulation-test
          bun run src/cleanup-database.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGDATABASE: railway
          PGSSLMODE: disable
          NODE_ENV: ci

name: Simulation Test

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulation-test:
    name: Simulation Test (${{ matrix.app_id }}, ${{ matrix.shard }})
    runs-on: self-hosted
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Note: Each job builds once, then runs the regression seeds in
        # `simulation-test/regression-seeds.txt` and `seeds` random seeds for the app.
        include:
          - { app_id: assessment, shard: 0, seeds: 3 }
          - { app_id: basepaint, shard: 0, seeds: 3 }
          - { app_id: feature-multichain, shard: 0, seeds: 3 }
          - { app_id: project-uniswap-v3-flash, shard: 0, seeds: 3 }
          - { app_id: reference-erc20, shard: 0, seeds: 3 }
          - { app_id: the-compact, shard: 0, seeds: 3 }
          - { app_id: uniswap-v4, shard: 0, seeds: 3 }
          # `super-assessment` seeds are slow, so they run in separate jobs.
          - { app_id: super-assessment, shard: 0, seeds: 1 }
          - { app_id: super-assessment, shard: 1, seeds: 1, regression: --no-regression }
          - { app_id: super-assessment, shard: 2, seeds: 1, regression: --no-regression }

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          foundry: "false"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: pnpm build
      - run: pnpm install

      - name: Test ${{ matrix.app_id }}
        run: |
          cd simulation-test
          ./run-seeds.sh ${{ matrix.app_id }} ${{ matrix.seeds }} ${{ matrix.regression }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PONDER_RPC_URL_1: ${{ secrets.PONDER_RPC_URL_1 }}
          PONDER_RPC_URL_10: ${{ secrets.PONDER_RPC_URL_10 }}
          PONDER_RPC_URL_130: ${{ secrets.PONDER_RPC_URL_130 }}
          PONDER_RPC_URL_8453: ${{ secrets.PONDER_RPC_URL_8453 }}
          PGDATABASE: railway
          PGSSLMODE: disable
          NODE_ENV: ci

  cleanup-simulation-test:
    name: Cleanup Simulation Test Databases
    needs: [simulation-test]
    if: ${{ always() }}
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          foundry: "false"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: |
          cd simulation-test
          bun run src/cleanup-database.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGDATABASE: railway
          PGSSLMODE: disable
          NODE_ENV: ci

name: Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test [core]
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun --filter "ponder" test

  test-create-ponder:
    name: Test [create-ponder]
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Set up foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: "v1.8.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun --filter create-ponder test

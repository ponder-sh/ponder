name: Typecheck

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  typecheck:
    name: Typecheck [TypeScript ${{ matrix.typescript }}]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Oldest version that compiles the sources, the version builds use, and the latest majors.
        typescript: ["5.4.5", "5.9.3", "6.0.3", "7.0.2"]
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build configs resolve sibling workspace packages from their built `dist`.
      - name: Build
        run: bun run build

      - name: Install TypeScript ${{ matrix.typescript }}
        run: npm install --prefix "$RUNNER_TEMP/typescript" --no-save "typescript@${{ matrix.typescript }}"

      - name: Typecheck
        run: |
          tsc="$RUNNER_TEMP/typescript/node_modules/.bin/tsc"
          "$tsc" --version
          for package in core client utils react create-ponder; do
            echo "::group::$package"
            "$tsc" --noEmit --project "packages/$package/tsconfig.build.json"
            echo "::endgroup::"
          done

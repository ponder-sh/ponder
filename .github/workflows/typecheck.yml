name: Typecheck

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  typecheck:
    name: Typecheck [TypeScript ${{ matrix.typescript }}]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Oldest version that compiles the sources, the version builds use, and the latest majors.
        typescript: ["5.4.5", "5.9.3", "6.0.3", "7.0.2"]
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build configs resolve sibling workspace packages from their built `dist`.
      - name: Build
        run: bun run --bun build

      # Installed outside the workspace so the repo's own `typescript` doesn't shadow it.
      - name: Install TypeScript ${{ matrix.typescript }}
        run: |
          mkdir -p "$RUNNER_TEMP/typescript"
          echo '{}' > "$RUNNER_TEMP/typescript/package.json"
          bun add --cwd "$RUNNER_TEMP/typescript" "typescript@${{ matrix.typescript }}"

      - name: Typecheck
        run: |
          tsc="$RUNNER_TEMP/typescript/node_modules/typescript/bin/tsc"
          bun "$tsc" --version
          for package in core client utils react create-ponder; do
            echo "::group::$package"
            bun "$tsc" --noEmit --project "packages/$package/tsconfig.build.json"
            echo "::endgroup::"
          done
